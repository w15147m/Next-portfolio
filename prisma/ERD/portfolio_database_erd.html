
<h2 class="sr-only">Entity relationship diagram of the portfolio database schema</h2>
<style>
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const src = `erDiagram
  USERS ||--o{ SKILLS : has
  USERS ||--o{ PROJECTS : has
  USERS ||--o{ SERVICES : has
  USERS ||--o{ SOCIALS : has
  USERS ||--o{ EXPERIENCES : has
  USERS ||--o{ EDUCATIONS : has
  USERS ||--o{ TESTIMONIALS : has
  PROJECTS ||--o{ PROJECT_IMAGES : has
  PROJECTS ||--o{ PROJECT_SKILLS : uses
  SKILLS ||--o{ PROJECT_SKILLS : used_in

  USERS {
    varchar id PK
    varchar name
    varchar email
    boolean email_verified
    varchar image
    varchar password
    varchar role
    timestamp created_at
    timestamp updated_at
  }
  SKILLS {
    bigint id PK
    varchar user_id FK
    varchar name
    varchar proficiency
    varchar image
    varchar desc
    timestamp created_at
    timestamp updated_at
  }
  PROJECTS {
    bigint id PK
    varchar user_id FK
    varchar name
    varchar image
    varchar desc
    timestamp created_at
    timestamp updated_at
  }
  PROJECT_SKILLS {
    bigint id PK
    bigint projects_id FK
    bigint skills_id FK
    timestamp created_at
    timestamp updated_at
  }
  PROJECT_IMAGES {
    bigint id PK
    bigint projects_id FK
    varchar image
    boolean default
    timestamp created_at
    timestamp updated_at
  }
  SERVICES {
    bigint id PK
    varchar user_id FK
    varchar name
    varchar desc
    varchar link
    timestamp created_at
    timestamp updated_at
  }
  SOCIALS {
    bigint id PK
    varchar user_id FK
    varchar name
    varchar desc
    varchar link
    timestamp created_at
    timestamp updated_at
  }
  EXPERIENCES {
    bigint id PK
    varchar user_id FK
    varchar company
    varchar position
    varchar image
    date start_date
    date end_date
    varchar desc
    timestamp created_at
    timestamp updated_at
  }
  EDUCATIONS {
    bigint id PK
    varchar user_id FK
    varchar institution
    varchar degree
    varchar field_of_study
    date start_date
    date end_date
    varchar desc
    timestamp created_at
    timestamp updated_at
  }
  TESTIMONIALS {
    bigint id PK
    varchar user_id FK
    varchar name
    varchar role
    varchar company
    varchar image
    text content
    timestamp created_at
    timestamp updated_at
  }
`;

const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
