
<h2 class="sr-only">Entity relationship diagram of the portfolio database schema</h2>
<style>
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const src = `erDiagram
  USERS ||--o{ PORTFOLIOS : owns
  PORTFOLIOS ||--o{ SKILLS : has
  PORTFOLIOS ||--o{ PROJECTS : has
  PORTFOLIOS ||--o{ SERVICES : has
  PORTFOLIOS ||--o{ SOCIALS : has
  PORTFOLIOS ||--o{ EXPERIENCES : has
  PORTFOLIOS ||--o{ EDUCATIONS : has
  PROJECTS ||--o{ PROJECT_IMAGES : has
  PROJECTS ||--o{ PROJECT_SKILLS : uses
  SKILLS ||--o{ PROJECT_SKILLS : used_in

  USERS {
    bigint id PK
  }
  PORTFOLIOS {
    bigint id PK
    bigint user_id FK
    varchar name
    varchar number
    varchar address
    varchar image
    text desc
    timestamp created_at
    timestamp updated_at
  }
  SKILLS {
    id id PK
    id portfolio_id FK
    string name
    string proficiency
    string image
    string desc
    datetime created_at
    datetime updated_at
  }
  PROJECTS {
    id id PK
    id portfolio_id FK
    string name
    string image
    string desc
    datetime created_at
    datetime updated_at
  }
  PROJECT_SKILLS {
    id id PK
    id projects_id FK
    id skills_id FK
    datetime created_at
    datetime updated_at
  }
  PROJECT_IMAGES {
    id id PK
    id projects_id FK
    string image
    boolean default
    datetime created_at
    datetime updated_at
  }
  SERVICES {
    id id PK
    id portfolio_id FK
    string name
    string desc
    string link
    datetime created_at
    datetime updated_at
  }
  SOCIALS {
    id id PK
    id portfolio_id FK
    string name
    string desc
    string link
    datetime created_at
    datetime updated_at
  }
  EXPERIENCES {
    id id PK
    id portfolio_id FK
    string company
    string position
    string image
    date start_date
    date end_date
    string desc
    datetime created_at
    datetime updated_at
  }
  EDUCATIONS {
    id id PK
    id portfolio_id FK
    string institution
    string degree
    string field_of_study
    date start_date
    date end_date
    string desc
    datetime created_at
    datetime updated_at
  }
`;

const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
